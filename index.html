const STORE=['settings','families','residents','cash','announcements','letters','archives'];const DBNAME='rt-smart-local-v3';let db,section='Dashboard';let state={settings:[],families:[],residents:[],cash:[],announcements:[],letters:[],archives:[]};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:0});const num=v=>Number(String(v||'0').replace(/[^\d-]/g,''))||0;const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);const today=()=>new Date().toISOString().slice(0,10);const settings=()=>state.settings.find(x=>x.id==='main')||{id:'main',rt:'001',rw:'001',name:'RT SMART',showName:true};const say=s=>{const t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3200)};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{for(const s of STORE)if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function all(s){return new Promise((res,rej)=>{let r=db.transaction(s,'readonly').objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(s,obj){return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(obj);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function del(s,id){return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function refresh(){for(const s of STORE)state[s]=await all(s);header();render()}async function save(s,obj){await put(s,obj);window.rtDriveDirty?.();await refresh();say('Tersimpan di perangkat')}async function remove(s,id){if(!confirm('Hapus data ini?'))return;await del(s,id);window.rtDriveDirty?.();await refresh()}function fileData(file){return new Promise((res,rej)=>{if(!file)return res('');if(file.size>20*1024*1024)return rej(Error('Maksimal 20 MB per berkas; foto tidak dikompres')); const r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>rej(Error('Gagal membaca berkas'));r.readAsDataURL(file)})}function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function header(){let s=settings();$('brandName').textContent=s.showName===false||!s.name?'RT '+(s.rt||'')+' / RW '+(s.rw||''):s.name;$('brandSub').textContent=`RT ${s.rt||'-'} / RW ${s.rw||'-'} • ${s.village||'Isi identitas RT'}`;if(s.logo){$('brandLogo').src=s.logo;$('brandLogo').style.display='block'}else{$('brandLogo').src='icon.svg';$('brandLogo').style.display='block'}}
const ICONS={Dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>','Data Warga':'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>','Data Keluarga':'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 15a5 5 0 0 1 4 5"/>','Kas RT':'<rect x="2" y="6" width="20" height="14" rx="3"/><path d="M16 13h6M4 6V4h15"/><circle cx="16" cy="13" r="1"/>',Surat:'<path d="M6 2h9l5 5v15H6zM15 2v5h5M9 12h8M9 16h8"/>',Pengumuman:'<path d="M3 10v4h4l10 5V5L7 10zM7 14l2 7h3l-2-6M20 9l2 3-2 3"/>',Arsip:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v12h14V9M10 13h4"/>',Pengaturan:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>',Publikasi:'<path d="M7 18H6a4 4 0 0 1-1-8 7 7 0 0 1 13-2 5 5 0 0 1 0 10h-1M12 22V11m-4 4 4-4 4 4"/>'};function svgIcon(n){let key=({wallet:'Kas RT',users:'Data Warga',file:'Surat',megaphone:'Pengumuman'})[n]||n;return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[key]||ICONS.Dashboard}</svg>`}
const menus=['Dashboard','Data Warga','Data Keluarga','Kas RT','Surat','Pengumuman','Arsip','Pengaturan','Publikasi'];function render(){ $('nav').innerHTML=menus.map(m=>`<button class="${m===section?'active':''}" data-menu="${esc(m)}">${svgIcon(m)} ${m}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{section=b.dataset.menu;editId=null;render()});let c=$('content');c.innerHTML=({Dashboard:dashboard,'Data Warga':residents,'Data Keluarga':families,'Kas RT':cash,Surat:letters,Pengumuman:announcements,Arsip:archives,Pengaturan:configuration,Publikasi:publication})[section]();bindSection()}
function dashboard(){let income=state.cash.filter(x=>x.type==='Masuk').reduce((a,x)=>a+num(x.amount),0),expense=state.cash.filter(x=>x.type==='Keluar').reduce((a,x)=>a+num(x.amount),0);let latest=state.announcements.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);return `<section class="panel hero"><div class="hero-sub">RINGKASAN KEUANGAN LINGKUNGAN</div><h2>Saldo Kas RT Saat Ini</h2><div class="balance">${money(income-expense)}</div><div class="hero-stats"><div><span>Total Pemasukan</span><strong>${money(income)}</strong></div><div><span>Total Pengeluaran</span><strong>${money(expense)}</strong></div></div></section><div class="grid" style="margin-bottom:18px"><div class="stat">Warga Terdaftar<strong>${state.residents.length} <small style="font-size:14px;font-weight:600">Jiwa</small></strong></div><div class="stat">Jumlah Keluarga<strong>${state.families.length} <small style="font-size:14px;font-weight:600">KK</small></strong></div><div class="stat">Surat Tersimpan<strong>${state.letters.length}</strong></div><div class="stat">Pengumuman<strong>${state.announcements.length}</strong></div></div><div class="section-heading"><h2>Akses Cepat</h2><span class="pill">Administrasi RT</span></div><div class="quick-grid">${[['Kas RT','wallet'],['Data Warga','users'],['Surat','file'],['Pengumuman','megaphone']].map(([m,icon])=>`<button class="quick-link" data-go="${m}"><span class="quick-icon">${svgIcon(icon)}</span><span>${m}</span></button>`).join('')}</div><div class="panel"><div class="section-heading"><h2>Pengumuman Terbaru</h2><span class="pill">Informasi RT</span></div>${latest.length?latest.map(a=>`<div class="activity-item"><strong>${esc(a.title)}</strong><span class="muted">${esc(a.date)}</span><p>${esc(a.body)}</p></div>`).join(''):'<div class="empty-state">Belum ada pengumuman. Tambahkan melalui menu Pengumuman.</div>'}</div><div class="notice">Data administrasi tersimpan di perangkat ini. Buat backup secara berkala. Informasi warga baru berubah setelah Anda memilih Publikasikan pada menu Publikasi.</div>`}

function fields(arr,obj={}){return arr.map(([key,label,type='text',extra=''])=>`<div class="field"><label for="f_${key}">${label}</label>${type==='textarea'?`<textarea id="f_${key}" name="${key}">${esc(obj[key])}</textarea>`:type==='select'?`<select id="f_${key}" name="${key}">${extra.split('|').map(v=>`<option ${obj[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<input id="f_${key}" name="${key}" type="${type}" value="${type==='file'?'':esc(obj[key])}" ${type==='file'?'accept="image/*,.pdf,.doc,.docx"':''}>`}</div>`).join('')}
function form(title,schema,obj={},opts={}){return `<div class="panel"><h2>${title}</h2><form id="entryForm"><input type="hidden" name="id" value="${esc(obj.id||'')}">${fields(schema,obj)}<button class="btn" type="submit">${obj.id?'Simpan Perubahan':'Tambah Data'}</button><button class="btn alt" type="button" id="cancelEdit">Bersihkan Form</button></form></div>`}
function rows(s,cols){return `<div class="panel scroll"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>Aksi</th></tr></thead><tbody>${state[s].map(x=>`<tr>${cols.map(([k])=>`<td>${k==='amount'?money(x[k]):esc(x[k])}</td>`).join('')}<td><button class="btn alt" data-edit="${x.id}">Edit</button><button class="btn danger" data-del="${x.id}">Hapus</button></td></tr>`).join('')||`<tr><td colspan="${cols.length+1}">Belum ada data.</td></tr>`}</tbody></table></div>`}
const schema={families:[['number','Nomor KK'],['head','Nama Kepala Keluarga'],['address','Alamat','textarea'],['document','Foto KK / berkas','file']],residents:[['name','Nama Lengkap'],['nik','NIK'],['family','Nomor KK'],['relation','Hubungan Keluarga','select','Kepala Keluarga|Istri|Anak|Orang Tua|Lainnya'],['birth','Tanggal Lahir','date'],['gender','Jenis Kelamin','select','Laki-laki|Perempuan'],['job','Pekerjaan'],['phone','Nomor HP'],['address','Alamat','textarea'],['document','Foto KTP / berkas','file']],cash:[['date','Tanggal','date'],['type','Jenis','select','Masuk|Keluar'],['category','Kategori / Sumber'],['amount','Nominal Rupiah (contoh: 5000000)'],['note','Keterangan','textarea'],['document','Bukti transaksi','file']],announcements:[['date','Tanggal','date'],['title','Judul'],['body','Isi pengumuman','textarea'],['document','Foto / lampiran','file']],archives:[['date','Tanggal','date'],['title','Nama arsip'],['note','Keterangan','textarea'],['document','Upload dokumen','file']]};let editId=null;

{{ketua}}`;
function templates(){return settings().templates||[]}
function letters(){let ts=templates();return `<div class="panel"><h2>Surat Berdasarkan Template Tersimpan</h2><p class="muted">Jenis surat mengikuti nama template yang telah diunggah dan disimpan. Pilih template, isi data warga, lalu unduh surat. Tidak ada daftar jenis surat terpisah.</p>${!ts.length?'<p class="notice">Belum ada template. Unggah dan simpan template di bagian Kelola Template Surat terlebih dahulu.</p>':''}<form id="letterForm"><div class="field"><label>Jenis Surat / Template Tersimpan</label><select id="letterTemplate" name="template" required><option value="">— Pilih template surat —</option>${ts.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></div>${fields([['citizen','Nama Warga (sesuai Data Warga)'],['purpose','Keperluan','textarea'],['date','Tanggal','date']])}<button class="btn" ${!ts.length?'disabled':''}>Buat & Unduh Surat (.doc)</button></form><p class="muted">Variabel: {{nama}}, {{nik}}, {{alamat}}, {{keperluan}}, {{tanggal}}, {{rt}}, {{rw}}, {{desa}}, {{kecamatan}}, {{kabupaten}}, {{ketua}}, {{jenis}}. Kop tersimpan otomatis digunakan.</p></div><div class="panel"><h2>Kelola Template Surat</h2><p class="muted">Upload template .txt atau .html, beri nama jenis surat, lalu simpan. Template tetap tersedia setelah aplikasi ditutup, dapat diedit, dihapus, dan ikut dalam backup. Untuk file Word .docx, salin isi surat ke editor terlebih dahulu.</p><form id="templateForm"><input type="hidden" id="templateId"><div class="field"><label>Upload File Template (.txt / .html)</label><input id="templateFile" type="file" accept=".txt,.html,.htm,text/plain,text/html"></div><div class="field"><label>Nama Jenis Surat (otomatis dari nama file, bisa diubah)</label><input id="templateName" required placeholder="Contoh: Surat Keterangan Domisili"></div><div class="field"><label>Isi Template</label><textarea id="templateBody" required rows="12" style="min-height:260px" placeholder="Unggah file atau ketik isi surat">${esc(DEFAULT_TEMPLATE)}</textarea></div><button class="btn" type="submit">Simpan Template Permanen</button><button class="btn alt" id="templateReset" type="button">Tambah Template Baru</button></form><div class="scroll"><table><thead><tr><th>Jenis Surat Tersimpan</th><th>Aksi</th></tr></thead><tbody>${ts.map(t=>`<tr><td>${esc(t.name)}</td><td><button class="btn alt" data-template-edit="${esc(t.id)}">Edit</button><button class="btn danger" data-template-delete="${esc(t.id)}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="2">Belum ada template tersimpan.</td></tr>'}</tbody></table></div></div>`+rows('letters',[['date','Tanggal'],['kind','Jenis'],['citizen','Warga']])}
function fillTemplate(t,vals){return t.replace(/\{\{\s*([a-zA-Z]+)\s*\}\}/g,(m,k)=>Object.hasOwn(vals,k.toLowerCase())?String(vals[k.toLowerCase()]??''):m)}
function configuration(){let s=settings();return `<div class="panel"><h2>Identitas RT & Logo</h2><form id="settingsForm">${fields([['rt','Nomor RT'],['rw','Nomor RW'],['name','Nama di samping logo (opsional)'],['village','Desa / Gampong'],['district','Kecamatan'],['city','Kabupaten / Kota'],['province','Provinsi'],['chair','Nama Ketua RT'],['address','Alamat sekretariat','textarea'],['logo','Upload logo RT','file'],['letterhead','Upload gambar kop surat','file']],s)}<label><input type="checkbox" name="showName" ${s.showName!==false?'checked':''}> Tampilkan nama di samping logo</label><p>${s.logo?`<img class="preview" src="${s.logo}" alt="Logo tersimpan">`:''}</p>${s.letterhead?`<p>Pratinjau kop surat:</p><img class="preview" src="${s.letterhead}" alt="Kop surat">`:''}<p><button class="btn">Simpan Identitas RT</button></p></form></div><div id="googleDriveSyncPanel" class="panel"><h2>Sinkronisasi Google Drive</h2><p class="muted">Hubungkan akun Google RT yang sama pada maksimal 3 perangkat. Foto disimpan dalam kualitas asli tanpa kompresi. Sinkronisasi memerlukan internet dan konfigurasi OAuth oleh penjual.</p><div id="driveSyncStatus" class="notice">Belum terhubung.</div><div class="actions"><button class="btn" id="driveConnect" type="button">Hubungkan Google</button><button class="btn alt" id="driveSyncNow" type="button">Sinkronkan Sekarang</button><button class="btn alt" id="driveDownload" type="button">Unduh Salinan Data</button></div><p class="muted">Ketiga perangkat dapat mengedit data yang berbeda. Bila dua perangkat mengedit catatan yang sama sebelum sinkronisasi, aplikasi menghentikan penggabungan agar tidak menimpa perubahan. Google Drive bukan database transaksi real-time.</p></div><div class="panel"><h2>Backup & Pulihkan Data</h2><p class="muted">Backup JSON mencakup dokumen dan foto. File dapat berukuran besar. Simpan di lokasi aman karena memuat data pribadi.</p><button id="backup" class="btn">Unduh Backup Seluruh Data</button><div class="field"><label>Impor file backup (.json)</label><input type="file" id="restore" accept=".json,application/json"></div><p class="notice">Peringatan: pemulihan menggantikan data lokal. Backup saat ini tidak terenkripsi; jangan dibagikan ke pihak lain.</p></div>`}
function publication(){let activated=!!localStorage.getItem('rt-license-code'),link=localStorage.getItem('rt-public-link')||'';return `<div class="panel"><h2>Dashboard Warga • RT SMART Premium</h2><p class="muted">Publikasikan saldo kas, jumlah warga/KK, dan pengumuman. NIK, KTP, KK, alamat pribadi dan arsip tidak dikirim.</p>${activated?`<p class="notice ok">✓ Lisensi aktif pada perangkat ini (maksimal 3 perangkat per kode). Publikasi tanpa pengaturan server.</p><button id="publish" class="btn">☁ Publikasikan Dashboard</button><button id="copyPublic" class="btn alt" ${link?'':'disabled'}>Salin Link Warga</button><p id="publishStatus" class="muted"></p><div id="publicLink">${link?`<a target="_blank" rel="noopener" href="${esc(link)}">${esc(link)}</a>`:''}</div>`:`<p class="notice">Aktivasi satu kali menggunakan kode yang diberikan penjual.</p><div class="field"><label>Kode aktivasi lifetime</label><input id="licenseCode" autocomplete="off" placeholder="RTSP-XXXX-XXXX-XXXX"></div><button id="activateLicense" class="btn">Aktifkan Aplikasi</button><p id="publishStatus" class="muted"></p>`}</div>`}
function bindSection(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{section=b.dataset.go;editId=null;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;render();scrollTo(0,0)});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await remove(({ 'Data Warga':'residents','Data Keluarga':'families','Kas RT':'cash',Pengumuman:'announcements',Arsip:'archives',Surat:'letters'})[section],b.dataset.del)});if($('cancelEdit'))$('cancelEdit').onclick=()=>{editId=null;render()};if($('entryForm'))$('entryForm').onsubmit=async e=>{e.preventDefault();try{let s=({'Data Warga':'residents','Data Keluarga':'families','Kas RT':'cash',Pengumuman:'announcements',Arsip:'archives'})[section];let fd=new FormData(e.target),obj=state[s].find(x=>x.id===fd.get('id'))||{id:uid()};for(let [k,v] of fd)if(k!=='id'){if(v instanceof File){if(v.size)obj[k]=await fileData(v)}else obj[k]=v}if(s==='cash')obj.amount=num(obj.amount);if(s==='residents'&&obj.nik&&state.residents.some(x=>x.id!==obj.id&&x.nik===obj.nik))throw Error('NIK sudah terdaftar');if(s==='families'&&obj.number&&state.families.some(x=>x.id!==obj.id&&x.number===obj.number))throw Error('Nomor KK sudah terdaftar');await save(s,obj);editId=null}catch(err){alert(err.message)}};if($('settingsForm'))$('settingsForm').onsubmit=async e=>{e.preventDefault();try{let fd=new FormData(e.target),s={...settings()};for(let [k,v] of fd){if(v instanceof File){if(v.size){if(!v.type.startsWith('image/'))throw Error('Logo dan kop harus berupa gambar');s[k]=await fileData(v)}}else s[k]=v}s.showName=e.target.elements.showName.checked;await save('settings',s)}catch(err){alert(err.message)}};if($('backup'))$('backup').onclick=()=>download('rt-smart-backup-'+today()+'.json',new Blob([JSON.stringify({version:3,created:new Date().toISOString(),data:state})],{type:'application/json'}));if($('restore'))$('restore').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;let v=JSON.parse(await f.text());if(!v.data||!STORE.every(s=>Array.isArray(v.data[s])))throw Error('Format backup tidak sesuai');if(!confirm('GANTI semua data lokal dengan backup ini?'))return;for(let s of STORE){await new Promise((res,rej)=>{let t=db.transaction(s,'readwrite');t.objectStore(s).clear();for(let obj of v.data[s])t.objectStore(s).put(obj);t.oncomplete=res;t.onerror=()=>rej(t.error)})}window.rtDriveDirty?.();await refresh();say('Data berhasil dipulihkan')}catch(err){alert('Gagal restore: '+err.message)}};if($('templateFile'))$('templateFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>500000)return alert('File template terlalu besar (maksimal 500 KB)');if(!/\.(txt|html|htm)$/i.test(f.name))return alert('Gunakan file .txt atau .html');let body=await f.text();if(/\.html?$/i.test(f.name)){let doc=new DOMParser().parseFromString(body,'text/html');doc.querySelectorAll('script,style,iframe,object,embed').forEach(n=>n.remove());body=doc.body.innerText||doc.body.textContent||''} $('templateBody').value=body;if(!$('templateName').value)$('templateName').value=f.name.replace(/\.[^.]+$/,'')};
if($('templateForm'))$('templateForm').onsubmit=async e=>{e.preventDefault();let id=$('templateId').value||uid(),name=$('templateName').value.trim(),body=$('templateBody').value.trim();if(!name||!body)return alert('Nama dan isi template wajib diisi');let st={...settings()},list=[...(st.templates||[])],i=list.findIndex(x=>x.id===id),obj={id,name,body};if(i<0)list.push(obj);else list[i]=obj;st.templates=list;await save('settings',st);say('Template tersimpan di perangkat')};
if($('templateReset'))$('templateReset').onclick=()=>{$('templateId').value='';$('templateName').value='';$('templateBody').value=DEFAULT_TEMPLATE;$('templateFile').value=''};
document.querySelectorAll('[data-template-edit]').forEach(b=>b.onclick=()=>{let t=templates().find(x=>x.id===b.dataset.templateEdit);if(!t)return;$('templateId').value=t.id;$('templateName').value=t.name;$('templateBody').value=t.body;$('templateForm').scrollIntoView({behavior:'smooth'})});
document.querySelectorAll('[data-template-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus template ini?'))return;let st={...settings()};st.templates=templates().filter(x=>x.id!==b.dataset.templateDelete);await save('settings',st)});
if($('letterForm'))$('letterForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),s=settings(),name=String(f.get('citizen')||''),w=state.residents.find(x=>x.name.toLowerCase()===name.toLowerCase());let t=templates().find(x=>x.id===f.get('template'));if(!t)return alert('Pilih template surat yang sudah disimpan');let letter={id:uid(),kind:t.name,citizen:name,purpose:f.get('purpose'),date:f.get('date')||today(),templateId:t.id};let vals={nama:name,nik:w?.nik||'........................',alamat:w?.address||'........................',keperluan:letter.purpose,tanggal:letter.date,rt:s.rt||'',rw:s.rw||'',desa:s.village||'',kecamatan:s.district||'',kabupaten:s.city||'',ketua:s.chair||'........................',jenis:letter.kind};let body=fillTemplate(t.body,vals);let paragraphs=body.split(/\n/).map(line=>`<div style="min-height:1.3em">${esc(line)||'&nbsp;'}</div>`).join('');let html=`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:'Times New Roman';font-size:12pt;margin:3cm"><div style="text-align:center">${s.letterhead?`<img src="${s.letterhead}" style="width:100%;max-height:130px;object-fit:contain">`:`<b>RT ${esc(s.rt)} / RW ${esc(s.rw)}<br>${esc(s.village||'')} ${esc(s.city||'')}</b><hr>`}</div><h3 style="text-align:center;text-decoration:underline">${esc(letter.kind.toUpperCase())}</h3><div style="line-height:1.5">${paragraphs}</div></body></html>`;await put('letters',letter);window.rtDriveDirty?.();download('surat-'+letter.id+'.doc',new Blob(['\ufeff'+html],{type:'application/msword'}));await refresh()};if($('publish'))$('publish').onclick=publish;if($('activateLicense'))$('activateLicense').onclick=activateLicense;if($('copyPublic'))$('copyPublic').onclick=()=>{navigator.clipboard.writeText(localStorage.getItem('rt-public-link')||'').then(()=>alert('Link warga disalin')).catch(()=>prompt('Salin link warga:',localStorage.getItem('rt-public-link')||''))}}
const PUBLIC_API=(window.RT_SMART_API||'').replace(/\/$/,'');
function rtDeviceId(){let id=localStorage.getItem('rt-device-id');if(!id){id=crypto.randomUUID();localStorage.setItem('rt-device-id',id)}return id}
async function activateLicense(){let el=$('publishStatus'),code=$('licenseCode').value.trim().toUpperCase();if(!PUBLIC_API){el.textContent='Aplikasi belum dikonfigurasi penjual. Hubungi penjual.';return}el.textContent='Memeriksa kode aktivasi...';try{let r=await fetch(PUBLIC_API+'/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,deviceId:rtDeviceId(),deviceName:(navigator.platform||'Perangkat')})});let d=await r.json();if(!r.ok)throw Error(d.error||'Aktivasi gagal');localStorage.setItem('rt-license-code',code);localStorage.setItem('rt-public-link',d.url);render()}catch(e){el.textContent=e.message}}
async function publish(){let code=localStorage.getItem('rt-license-code');if(!PUBLIC_API||!code){alert('Aktivasi diperlukan.');return}let s=settings();let payload={name:s.showName===false?'':s.name||'',logo:s.logo||'',rt:s.rt||'',rw:s.rw||'',village:s.village||'',district:s.district||'',city:s.city||'',province:s.province||'',residents:state.residents.length,families:state.families.length,income:state.cash.filter(x=>x.type==='Masuk').reduce((a,x)=>a+num(x.amount),0),expense:state.cash.filter(x=>x.type==='Keluar').reduce((a,x)=>a+num(x.amount),0),announcements:state.announcements.map(x=>({title:x.title,body:x.body,date:x.date})).slice(-30)};let el=$('publishStatus');el.textContent='Mengirim ringkasan publik...';try{let r=await fetch(PUBLIC_API+'/publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+code,'X-RT-Device':rtDeviceId()},body:JSON.stringify(payload)});let d=await r.json();if(!r.ok)throw Error(d.error||'Publikasi gagal');localStorage.setItem('rt-public-link',d.url);el.textContent='✓ Berhasil dipublikasikan '+new Date().toLocaleString('id-ID');$('publicLink').innerHTML=`<a href="${esc(d.url)}" target="_blank" rel="noopener">Buka Dashboard Warga ↗</a>`;$('copyPublic').disabled=false}catch(err){el.textContent='Publikasi gagal: '+err.message}}

(async()=>{try{db=await openDB();await refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn)}catch(err){$('content').innerHTML=`<div class="panel"><h2>Gagal membuka penyimpanan</h2><p>${esc(err.message)}</p><p>Gunakan HTTPS/GitHub Pages dan pastikan penyimpanan situs diizinkan. Jangan hapus data situs sebelum backup.</p></div>`}})();
</script></body></html>
